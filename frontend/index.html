<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2e9" />
    <meta
      name="description"
      content="Live plants, ready to take home. See every plant with its price and order on WhatsApp — Ornamental Horticulture by StomatalWorld."
    />
    <!-- How the home page looks when its link is shared. A plant's own address gets
         its own version of these, written in by api/plant.js. The address here is
         the shop's own domain; if it ever moves, change it in server/share.js and
         frontend/public/robots.txt too. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StomatalWorld" />
    <meta property="og:title" content="StomatalWorld — Live plants, ready to take home" />
    <meta
      property="og:description"
      content="See every plant with its price and order on WhatsApp."
    />
    <meta property="og:image" content="https://www.stomatalworld.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Who the site belongs to, for a search for the shop's name rather than for a
         plant. A plant's page gets its own Product version of this instead, written
         in by api/plant.js, which takes this one out. `sameAs` is the Instagram
         handle built into src/data/contact.js: a crawler cannot run the page, so it
         can't read the one saved in Settings. If the handle ever changes for good,
         change it in both places. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "StomatalWorld",
        "alternateName": "Stomatal World",
        "description": "Ornamental horticulture: live indoor and outdoor plants, with a page for every plant.",
        "url": "https://www.stomatalworld.app/",
        "logo": "https://www.stomatalworld.app/favicon-512.png",
        "image": "https://www.stomatalworld.app/og-image.png",
        "sameAs": ["https://www.instagram.com/stomatalworld"]
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The shop's name comes first here, and only here: this is the page that
         answers a search for the name itself. A plant's page is the other way
         round (Peace Lily — StomatalWorld), because there the plant is what was
         searched for. -->
    <title>StomatalWorld — Live plants, ready to take home</title>
    <!-- The plants come from here, a different address from the page, and opening a
         connection to it takes a moment. Starting now, while the page's script is
         still downloading, means it is already open when the plant list is asked for.
         If the API ever moves, change this and PRODUCTION_API in src/lib/api.js. -->
    <link rel="preconnect" href="https://stomatalworld-api.vercel.app" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
